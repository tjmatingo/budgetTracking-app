{% extends 'budgetrack/base.html' %}
{% block title %}Expenses{% endblock %}

{% block content %}
    <h2>Expense List</h2>
    <ul>
        {% for expense in expenses %}
            <li>{{ expense.description }}: ${{ expense.amount }}</li>
            <br>
        {% empty %}
            <li>No expenses available.</li>
        {% endfor %}
    </ul>
{% endblock %}
